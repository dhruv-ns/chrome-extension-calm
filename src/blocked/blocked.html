<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay in your flow — Aura Focus</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="glow-bg"></div>

  <main class="focus-card">
    <div class="shield-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>

    <h1 id="focus-headline" class="headline">Stay in your flow</h1>
    <p class="subline">This website is blocked during Focus Mode.</p>

    <div class="goal-box">
      <span class="goal-label">Your commitment today:</span>
      <div id="top-task-text" class="goal-task">Focus on what matters most.</div>
    </div>

    <div class="actions">
      <button id="btn-back-goal" class="btn btn-primary">Back to My Goal</button>
      <button id="btn-snooze-5" class="btn btn-ghost">Give me 5 minutes</button>
    </div>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
